id: research-only-no-wallet-authority-js
language: JavaScript
severity: error
message: "Research-only boundary: wallet authority, signing, writes, deployment, and transaction broadcast identifiers are forbidden."
note: "Use read-only public-client calls and shadow/counterfactual execution only. Narrow canary test exceptions are separately enforced by scripts/canary-boundary-check.mjs."
ignores:
  - scripts/canary-boundary-check.mjs
  - scripts/pons-e2-v4-recovery-check.mjs
  - scripts/pons-e3b-runtime-failover-check.mjs
rule:
  any:
    - all:
        - kind: identifier
        - regex: '^(createWalletClient|privateKeyToAccount|mnemonicToAccount|hdKeyToAccount|writeContract|sendTransaction|sendRawTransaction|sendCalls|deployContract|signTransaction|signMessage|signTypedData|signAuthorization|__researchBoundaryForbiddenTestOnly)$'
    - all:
        - kind: property_identifier
        - regex: '^(createWalletClient|privateKeyToAccount|mnemonicToAccount|hdKeyToAccount|writeContract|sendTransaction|sendRawTransaction|sendCalls|deployContract|signTransaction|signMessage|signTypedData|signAuthorization|__researchBoundaryForbiddenTestOnly)$'
    - all:
        - kind: string
        - regex: '^[''\"](?:createWalletClient|privateKeyToAccount|mnemonicToAccount|hdKeyToAccount|writeContract|sendTransaction|sendRawTransaction|sendCalls|deployContract|signTransaction|signMessage|signTypedData|signAuthorization|__researchBoundaryForbiddenTestOnly)[''\"]$'
