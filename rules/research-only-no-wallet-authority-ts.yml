id: research-only-no-wallet-authority-ts
language: TypeScript
severity: error
message: "Research-only boundary: wallet authority, signing, writes, deployment, and transaction broadcast identifiers are forbidden outside the explicitly bounded canary adapter."
note: "Use read-only public-client calls and shadow/counterfactual execution only. src/canary is separately guarded by scripts/canary-boundary-check.mjs."
ignores:
  - src/canary/**
rule:
  any:
    - all:
        - kind: identifier
        - regex: '^(createWalletClient|privateKeyToAccount|mnemonicToAccount|hdKeyToAccount|writeContract|sendTransaction|sendRawTransaction|sendCalls|deployContract|signTransaction|signMessage|signTypedData|signAuthorization|__researchBoundaryForbiddenTestOnly)$'
    - all:
        - kind: property_identifier
        - regex: '^(createWalletClient|privateKeyToAccount|mnemonicToAccount|hdKeyToAccount|writeContract|sendTransaction|sendRawTransaction|sendCalls|deployContract|signTransaction|signMessage|signTypedData|signAuthorization|__researchBoundaryForbiddenTestOnly)$'
    - all:
        - kind: string
        - regex: '^[''\"](?:createWalletClient|privateKeyToAccount|mnemonicToAccount|hdKeyToAccount|writeContract|sendTransaction|sendRawTransaction|sendCalls|deployContract|signTransaction|signMessage|signTypedData|signAuthorization|__researchBoundaryForbiddenTestOnly)[''\"]$'
