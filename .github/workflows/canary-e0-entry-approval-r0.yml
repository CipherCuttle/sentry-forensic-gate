name: canary-e0-entry-approval-r0

on:
  push:
    branches:
      - agent/canary-e0-live-authorization-readiness-r0
    paths:
      - 'src/canary/approval.ts'
      - 'src/canary/entryApproval.ts'
      - 'src/canary/entryApprovalStore.ts'
      - 'src/canary/viemCanaryExecutor.ts'
      - 'src/canary/swapIntent.ts'
      - 'scripts/canary-boundary-check.mjs'
      - 'scripts/canary-e0-entry-approval-r0-check.mjs'
      - 'scripts/canary-e0-roundtrip-qualification-r0-check.mjs'
      - 'scripts/canary-e0-approval-lifecycle-r0-check.mjs'
      - 'scripts/canary-e0-approval-executor-r0-check.mjs'
      - 'scripts/canary-e0-roundtrip-runtime-r0-check.mjs'
      - 'scripts/canary-e0-live-wiring-readiness-r0-check.mjs'
      - '.github/workflows/canary-e0-entry-approval-r0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-entry-approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm build
      - name: Preserve reviewed predecessor authority
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          env -u CANARY_PRIVATE_KEY CANARY_LIVE=false node scripts/canary-e0-roundtrip-qualification-r0-check.mjs
          env -u CANARY_PRIVATE_KEY CANARY_LIVE=false node scripts/canary-e0-approval-lifecycle-r0-check.mjs
          env -u CANARY_PRIVATE_KEY CANARY_LIVE=false node scripts/canary-e0-approval-executor-r0-check.mjs
          env -u CANARY_PRIVATE_KEY CANARY_LIVE=false node scripts/canary-e0-roundtrip-runtime-r0-check.mjs
          env -u CANARY_PRIVATE_KEY CANARY_LIVE=false node scripts/canary-e0-live-wiring-readiness-r0-check.mjs
      - name: Preserve narrow wallet-authority boundary
        run: node scripts/canary-boundary-check.mjs
      - name: Preserve repository research-only boundary
        run: pnpm --package=@ast-grep/cli@0.45.0 dlx ast-grep scan
      - name: Assert no live wallet secret or live mode
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          test -z "${CANARY_PRIVATE_KEY:-}"
          test "${CANARY_LIVE:-false}" = "false"
          echo 'CANARY_E0_ENTRY_APPROVAL_NO_LIVE_SECRET=PASS'
      - name: Qualify exact pre-buy approval offline
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          node scripts/canary-e0-entry-approval-r0-check.mjs | tee canary-e0-entry-approval-r0.json
          grep -q '"verdict": "CANARY_E0_ENTRY_APPROVAL_EXECUTOR_R0_PASS"' canary-e0-entry-approval-r0.json
          grep -q '"cleanWalletZeroAllowanceRequired": true' canary-e0-entry-approval-r0.json
          grep -q '"exactIncludedAllowanceRequired": true' canary-e0-entry-approval-r0.json
          grep -q '"buyPreflightSatisfiedAfterExactApproval": true' canary-e0-entry-approval-r0.json
          grep -q '"singletonEntryApprovalSlot": true' canary-e0-entry-approval-r0.json
          grep -q '"sameViemCanaryExecutorUsed": true' canary-e0-entry-approval-r0.json
          grep -q '"parentBuyExactBindingRequired": true' canary-e0-entry-approval-r0.json
          grep -q '"frozenParentBuyLoadedFromStore": true' canary-e0-entry-approval-r0.json
          grep -q '"reservationCapabilityGatesSigning": true' canary-e0-entry-approval-r0.json
          grep -q '"capabilityReplayCannotSign": true' canary-e0-entry-approval-r0.json
          grep -q '"duplicateReservationCannotSign": true' canary-e0-entry-approval-r0.json
          grep -q '"restartReservedCannotSign": true' canary-e0-entry-approval-r0.json
          grep -q '"intentBoundBroadcastValidation": true' canary-e0-entry-approval-r0.json
          grep -q '"unknownSignedAuthorityBlocked": true' canary-e0-entry-approval-r0.json
          grep -q '"preBroadcastSignedEnvelopeValidationPreserved": true' canary-e0-entry-approval-r0.json
          grep -q '"networkBroadcastInvoked": false' canary-e0-entry-approval-r0.json
      - uses: actions/upload-artifact@v4
        with:
          name: canary-e0-entry-approval-r0-evidence
          path: canary-e0-entry-approval-r0.json
          if-no-files-found: error
