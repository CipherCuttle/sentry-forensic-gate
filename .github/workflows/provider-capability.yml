name: provider-capability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/provider-capability.yml'
      - 'src/authority/**'
      - 'src/providerCapabilityCli.ts'
      - 'src/sentry/contracts.ts'
      - 'src/sentry/viemSource.ts'
      - 'src/tsunami/viemBaselineSource.ts'
      - 'src/tsunami/contracts.ts'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Probe default public Ink RPC
        run: pnpm start:provider-capability
