name: fast-vet-r0-authorization-r1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/FAST_VET_R0_AUTHORIZATION_R1.md'
      - 'docs/agent-packets/FAST_VET_R0_AUTHORIZATION_R1.json'
      - 'fixtures/fast-vet-r0-authorization-r1.json'
      - 'scripts/dev-spine-check.mjs'
      - 'scripts/dev-spine-check-test.mjs'
      - 'scripts/dev-spine-context.mjs'
      - 'scripts/dev-spine-pack.mjs'
      - 'scripts/dev-spine-receipt.mjs'
      - '.github/workflows/fast-vet-r0-authorization-r1.yml'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  authorization-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate fail-closed authorization metadata
        run: |
          node scripts/dev-spine-check-test.mjs
          node scripts/dev-spine-check.mjs
      - name: Verify bounded hostile-review closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=.fast-vet-auth/review
          mkdir -p "$ROOT"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
          VERSION="X-GitHub-Api-Version: 2022-11-28"
          curl -fsSL -H "$AUTH" -H "$VERSION" "$API/pulls/comments/4020758274" > "$ROOT/p1-a.json"
          curl -fsSL -H "$AUTH" -H "$VERSION" "$API/pulls/comments/4020758282" > "$ROOT/p1-b.json"
          curl -fsSL -H "$AUTH" -H "$VERSION" "$API/issues/comments/5690352056" > "$ROOT/target-request.json"
          curl -fsSL -H "$AUTH" -H "$VERSION" "$API/issues/comments/5690369864" > "$ROOT/target-result.json"
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          r=Path(sys.argv[1])
          def req(c,m):
            if not c: raise SystemExit('FAST_VET_AUTH_REVIEW_CLOSURE=FAIL '+m)
          a=json.loads((r/'p1-a.json').read_text()); b=json.loads((r/'p1-b.json').read_text())
          for item,cid,needle in [(a,4020758274,'Bind replay provenance'),(b,4020758282,'Prove normalized semantics')]:
            req(item.get('id')==cid,'P1 comment id drift')
            req(item.get('pull_request_review_id')==5216435120,'initial review id drift')
            req((item.get('user') or {}).get('login')=='chatgpt-codex-connector[bot]','P1 author drift')
            req('P1' in item.get('body','') and needle in item.get('body',''),'P1 body drift')
          q=json.loads((r/'target-request.json').read_text()); z=json.loads((r/'target-result.json').read_text())
          req(q.get('id')==5690352056 and (q.get('user') or {}).get('login')=='CipherCuttle','target request identity drift')
          req('c54c58b75e34ff390e0bf7f541b155d93de1a93d' in q.get('body',''),'target request repair-head drift')
          req('4020758274' in q.get('body','') and '4020758282' in q.get('body',''),'target request P1 scope drift')
          req(z.get('id')==5690369864 and (z.get('user') or {}).get('login')=='chatgpt-codex-connector[bot]','target result identity drift')
          req("Didn't find any major issues" in z.get('body',''),'target result verdict drift')
          req('c54c58b75e' in z.get('body',''),'target result reviewed-head drift')
          print('FAST_VET_AUTH_REVIEW_CLOSURE=PASS')
          PY
      - name: Fetch and verify real predecessor provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=.fast-vet-auth/predecessor
          mkdir -p "$ROOT/unzipped"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
          VERSION="X-GitHub-Api-Version: 2022-11-28"
          curl -fsSL -H "$AUTH" -H "$VERSION" "$API/actions/runs/35001582697" > "$ROOT/run.json"
          curl -fsSL -H "$AUTH" -H "$VERSION" "$API/actions/artifacts/10410898359" > "$ROOT/artifact.json"
          curl -fsSL -L -H "$AUTH" -H "$VERSION" "$API/actions/artifacts/10410898359/zip" -o "$ROOT/artifact.zip"
          unzip -q "$ROOT/artifact.zip" -d "$ROOT/unzipped"
          python3 - "$ROOT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          r=Path(sys.argv[1]); run=json.loads((r/'run.json').read_text()); art=json.loads((r/'artifact.json').read_text())
          def req(c,m):
            if not c: raise SystemExit('FAST_VET_AUTH_PREDECESSOR_PROVENANCE=FAIL '+m)
          head='75588056de53b94f92b5cf3b40e89e2b5521031a'; rid=35001582697; aid=10410898359
          req(run.get('id')==rid and run.get('head_sha')==head,'run identity/head drift')
          req(run.get('status')=='completed' and run.get('conclusion')=='success','run not successful')
          req(run.get('name')=='historical-full-replay-r1-stage-b','workflow name drift')
          req(art.get('id')==aid and art.get('name')=='historical-full-replay-r1-evidence','artifact identity drift')
          req(art.get('expired') is False,'artifact expired')
          req(art.get('digest')=='sha256:ebeb0ff5d6c3fecc9dac2dde4397e8592f72a3501aa3b9980662c3bd8c71fb6a','artifact digest drift')
          wr=art.get('workflow_run') or {}; req(wr.get('id')==rid and wr.get('head_sha')==head,'artifact run/head binding drift')
          out=r/'unzipped'; files=sorted(str(p.relative_to(out)) for p in out.rglob('*') if p.is_file())
          req(files==['historical-full-replay-r1-live-receipt.json'],f'unexpected artifact contents:{files}')
          b=(out/files[0]).read_bytes(); req(hashlib.sha256(b).hexdigest()=='916c9f4bc637a90e329abfaa3346debda83d28f3e642cac6c36ddd2122ab3825','receipt SHA-256 drift')
          x=json.loads(b); req(x.get('schema')=='historical-full-replay-r1-live-receipt/v1','receipt schema drift')
          req(x.get('phase')=='HISTORICAL_FULL_REPLAY_R1' and x.get('stage')=='STAGE_B_FULL_147_X_5_REPLAY','receipt phase/stage drift')
          req(x.get('verdict')=='HISTORICAL_FULL_REPLAY_R1_ACCOUNTING_PASS' and x.get('shadowOnly') is True,'receipt verdict/authority drift')
          req(x.get('sourceMode')=='LIVE_ARCHIVE_RPC_REVIEWED_HISTORICAL_PIPELINES','source mode drift')
          req(x.get('sourceScopeIdentitySha256')=='b5184624928e9dc36fd75558bf599074e9eb67e03658fe9b3f3e00668b5b8211','scope drift')
          req(x.get('authorityMapSha256')=='c5346e572255385acd1744552633d5ad533d86d3821a8d857a432471e6022275','authority map drift')
          req(x.get('baselinePolicyVersion')=='HISTORICAL_EXECUTABLE_BASELINE_REDSTONE_ASOF_R1','baseline policy drift')
          req(x.get('outcomePolicyVersion')=='HISTORICAL_FORWARD_OUTCOMES_REDSTONE_ASOF_R1','outcome policy drift')
          req(x.get('expectedLaunches')==147 and x.get('launchesAccounted')==147 and x.get('baselineComplete')==147 and x.get('baselineUnverified')==0,'baseline accounting drift')
          req(x.get('expectedHorizonCells')==735 and x.get('horizonCellsAccounted')==735 and x.get('outcomesComplete')==735 and x.get('outcomesUnverified')==0 and x.get('outcomesNotAttemptedBaselineUnverified')==0,'outcome accounting drift')
          rows=x.get('rows'); req(isinstance(rows,list) and len(rows)==147,'row count drift'); hs=[60000,300000,1800000,7200000,86400000]
          for i,row in enumerate(rows,1):
            base=row.get('baseline') or {}; req(base.get('status')=='COMPLETE' and len(base.get('legs') or [])==5,f'row {i} baseline drift')
            outs=row.get('outcomes') or []; req(len(outs)==5 and sorted(o.get('horizonMs') for o in outs)==hs and all(o.get('status')=='COMPLETE' for o in outs),f'row {i} outcomes drift')
          print('FAST_VET_AUTH_PREDECESSOR_PROVENANCE=PASS')
          PY
      - name: Fetch exact pre-existing FAST_VET source
        run: |
          set -euo pipefail
          SOURCE=22fcce4c301e791a59c68b19b198bd1bea104138
          ROOT=.fast-vet-auth/pr13
          git fetch --no-tags --depth=1 origin "$SOURCE"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE"
          for path in docs/FAST_VET_R0.md src/evaluation/fastVet.ts src/evaluation/fastVetShadow.ts scripts/fast-vet-check.mjs src/forensic/creatorOutcome.ts src/outcome/forwardTypes.ts; do
            mkdir -p "$ROOT/$(dirname "$path")"
            git show "$SOURCE:$path" > "$ROOT/$path"
          done
      - name: Verify normalized rule semantic parity with PR13 source
        run: |
          python3 - .fast-vet-auth/pr13 <<'PY'
          import hashlib,json,re,sys
          from pathlib import Path
          root=Path(sys.argv[1]); f=json.loads(Path('fixtures/fast-vet-r0-authorization-r1.json').read_text())
          def req(c,m):
            if not c: raise SystemExit('FAST_VET_R0_SOURCE_PARITY=FAIL '+m)
          def blob(b): return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          def compact(s): return ' '.join(s.split())
          def inc(s,frag,label): req(compact(frag) in compact(s),'source semantic mismatch:'+label)
          def num(s,n):
            m=re.search(rf"export const {re.escape(n)} = ([0-9_]+)(?:n| as const)?;",s); req(m is not None,'missing const:'+n); return int(m.group(1).replace('_',''))
          def string(s,n):
            m=re.search(rf"export const {re.escape(n)} = '([^']+)' as const;",s); req(m is not None,'missing const:'+n); return m.group(1)
          src={}
          for p,h in f['source']['blobs'].items():
            b=(root/p).read_bytes(); req(blob(b)==h,'source blob drift:'+p); src[p]=b.decode()
          d=src['src/evaluation/fastVet.ts']; sh=src['src/evaluation/fastVetShadow.ts']; cr=src['src/forensic/creatorOutcome.ts']; fw=src['src/outcome/forwardTypes.ts']; doc=src['docs/FAST_VET_R0.md']; tst=src['scripts/fast-vet-check.mjs']; ds=f['decision_semantics']; ss=f['shadow_semantics']
          req(string(d,'FAST_VET_R0')==ds['policy_version'] and num(d,'FAST_VET_PRIMARY_NOTIONAL_USD_MICROS')==ds['primary_notional_usd_micros'],'decision identity drift')
          inc(d,"export type FastVetDecision = 'PASS' | 'REJECT' | 'UNKNOWN';",'decision set'); inc(d,"action: decision === 'PASS' ? 'BUY_ELIGIBLE' : 'SKIP'",'actions')
          branches=[("if (!baseline) { return result('UNKNOWN', ['BASELINE_MISSING']",'missing baseline'),("if (baseline.status !== 'COMPLETE') { return result('UNKNOWN', ['BASELINE_UNVERIFIED']",'baseline unverified'),("if (!primaryLeg) { return result('UNKNOWN', ['PRIMARY_LEG_MISSING']",'primary leg'),("if (!primaryLeg.entry.executable) { return result('REJECT', ['PRIMARY_ENTRY_NOT_EXECUTABLE']",'entry reject'),("if (!primaryLeg.reverse?.executable || primaryLeg.independentReverseRecoveryBps === null) { return result('REJECT', ['PRIMARY_REVERSE_NOT_EXECUTABLE']",'reverse reject'),("if (!feature) { return result('UNKNOWN', ['CREATOR_FEATURE_MISSING']",'feature missing'),("if (adverseCreatorCount(feature) > 0) { return result('REJECT', ['KNOWN_PRIOR_ADVERSE_CREATOR']",'adverse creator'),("if (feature.coverage === 'UNKNOWN' || feature.coverage === 'PARTIAL') { return result('UNKNOWN', ['CREATOR_HISTORY_INCOMPLETE']",'creator incomplete'),("return result('PASS', [], evidenceFrom(baseline, feature));",'PASS')]
          for frag,label in branches: inc(d,frag,label)
          inc(d,"return feature.catastrophicLossCount + feature.exitFailureCount + feature.liquidityCollapseCount;",'creator adverse classes'); inc(d,"feature.launchId !== baseline.launchId || feature.baselineId !== baseline.baselineId",'feature binding')
          req(ds['reject_reasons']==['PRIMARY_ENTRY_NOT_EXECUTABLE','PRIMARY_REVERSE_NOT_EXECUTABLE','KNOWN_PRIOR_ADVERSE_CREATOR'],'reject reasons drift'); req(ds['unknown_reasons']==['BASELINE_MISSING','BASELINE_UNVERIFIED','PRIMARY_LEG_MISSING','CREATOR_FEATURE_MISSING','CREATOR_HISTORY_INCOMPLETE'],'unknown reasons drift')
          inc(cr,"export type CreatorOutcomeCoverage = 'NO_HISTORY' | 'UNKNOWN' | 'PARTIAL' | 'COMPLETE';",'coverage universe'); req(ds['pass_creator_coverage']==['NO_HISTORY','COMPLETE'],'PASS coverage drift'); req(ds['recovery_bps_threshold'] is None and re.search(r'independentReverseRecoveryBps\s*[<>]=?',d) is None,'recovery threshold drift')
          req(string(sh,'FAST_VET_SHADOW_R0')==ss['receipt_version'] and string(sh,'FAST_VET_SHADOW_STRATEGY_LABEL')==ss['strategy_label'],'shadow identity drift'); inc(sh,"status: 'SMOKE_ONLY'",'SMOKE_ONLY'); inc(sh,"const rows = suppliedRows.filter((row) => row.baseline?.status === 'COMPLETE');",'COMPLETE cohort'); inc(sh,"if (vet.decision === 'PASS')",'PASS exposure'); inc(sh,"if (outcome.policyVersion !== FORWARD_OUTCOMES_R1) return null;",'outcome policy'); inc(sh,"if (outcome.horizonMs !== CREATOR_OUTCOME_HORIZON_MS) return null;",'24h'); inc(sh,"outcome.entryNotionalUsdMicros !== PRIMARY_OUTCOME_NOTIONAL_USD_MICROS",'$1'); inc(sh,"return classification === 'CATASTROPHIC_LOSS' || classification === 'EXIT_FAILURE' || classification === 'LIQUIDITY_COLLAPSE';",'adverse classes'); inc(sh,"const win = target.classification === 'NORMAL_WIN';",'win class')
          req(num(cr,'CREATOR_OUTCOME_HORIZON_MS')==ss['target_horizon_ms'] and num(fw,'PRIMARY_OUTCOME_NOTIONAL_USD_MICROS')==ss['primary_outcome_notional_usd_micros'] and string(fw,'FORWARD_OUTCOMES_R1')==ss['source_outcome_policy'],'transitive constants drift')
          for metric in ['tradeRetentionBps','outcomeCoverageBps','adverseExposureReductionBps','winRetentionBps','upsideCaptureBps']: inc(sh,metric+':','metric '+metric)
          inc(tst,"assert.equal(evaluateFastVet({ baseline: null, creatorFeature: null }).action, 'SKIP');",'UNKNOWN->SKIP regression'); inc(tst,'assert.deepEqual(withOutsideControl.metrics, first.metrics);','denominator regression'); inc(tst,'assert.equal(wrongHorizon.metrics.resolvedOutcomeCount, 0);','24h regression'); inc(doc,'There is deliberately no sample-adequacy claim, probability, p-value, confidence interval, ML model, tuned threshold, or promotion decision.','non-promotion boundary')
          req(ss['no_sample_adequacy_claim'] is True and ss['no_probability_or_p_value'] is True and ss['no_threshold_tuning'] is True,'scientific boundary drift')
          print('FAST_VET_R0_SOURCE_PARITY=PASS')
          PY
      - name: Prove authorization PR contains no FAST_VET implementation
        run: |
          test ! -e src/evaluation/fastVet.ts
          test ! -e src/evaluation/fastVetShadow.ts
          test ! -e src/fastVetShadowCli.ts
          test ! -e scripts/fast-vet-check.mjs
          echo "FAST_VET_R0_IMPLEMENTATION_ABSENT=PASS"
