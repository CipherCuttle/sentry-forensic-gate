name: pons-v2-archive-capability-probe

on:
  push:
    branches:
      - agent/m2h-pons-forward-outcome-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ROBINHOOD_ARCHIVE_RPC_URL: ${{ secrets.ROBINHOOD_ARCHIVE_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Probe historical Robinhood state providers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/pons-v2-archive-capability-probe.mjs \
            | tee artifacts/pons-v2-archive-capability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pons-v2-archive-capability
          path: artifacts/pons-v2-archive-capability.json
          if-no-files-found: error
