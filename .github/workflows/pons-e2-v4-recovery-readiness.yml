name: pons-e2-v4-recovery-readiness

on:
  push:
    branches:
      - agent/pons-e2-signed-v4-recovery-v1
  pull_request:
    paths:
      - 'src/canary/ponsE2V4RecoveryIntent.ts'
      - 'src/canary/ponsE2RecoveryState.ts'
      - 'src/canary/ponsE2RecoveryReconcile.ts'
      - 'src/canary/viemPonsE2V4RecoveryExecutor.ts'
      - 'src/canary/ponsE2V4RecoveryCli.ts'
      - 'scripts/pons-e2-v4-recovery-check.mjs'
      - 'docs/PONS_E2_SIGNED_V4_RECOVERY_V1.md'
      - 'docs/evidence/PONS_E2_SIGNED_V4_RECOVERY_DRY_CLOSURE_2026-09-19.json'
      - '.github/workflows/pons-e2-v4-recovery-readiness.yml'
      - 'package.json'

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PONS_E2_LIVE: ''
      PONS_E2_PRIVATE_KEY: ''
      PONS_E2_BROADCAST_AUTHORITY: ''
      PONS_E0_PRIVATE_KEY: ''
      PONS_E1_PRIVATE_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies without native postinstall
        run: npm install --package-lock=false --include=dev --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify E2 signer and crash-state fences offline
        run: npm run ponse2v4recoverycheck

      - name: Verify current graduated Pons recovery plan without signer
        env:
          PONS_E2_ENABLED: 'true'
          PONS_E2_TOKEN: '0x8ECD7b553E36248164616c271B4B3C171bC8226b'
          PONS_E2_OWNER: '0xE152cd6ab035c0a8b7D8147373dd201579873a41'
          PONS_E2_RPC_URL: 'https://rpc.mainnet.chain.robinhood.com'
          PONS_E2_SLIPPAGE_BPS: '500'
        run: npm run start:pons-e2-v4-recovery

      - name: Assert no live authority in CI
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PONS_E2_LIVE}" || -n "${PONS_E2_PRIVATE_KEY}" || -n "${PONS_E2_BROADCAST_AUTHORITY}" ]]; then
            echo "E2 readiness CI must not receive live/signing/broadcast authority"
            exit 1
          fi
          grep -q "PONS_E2_BROADCAST_AUTHORITY_DISABLED"             src/canary/viemPonsE2V4RecoveryExecutor.ts
          grep -q "PONS_E2_NONTERMINAL_STATE_REQUIRES_MANUAL_RECONCILIATION"             src/canary/ponsE2RecoveryState.ts
          grep -q "autoRetryAllowed: false"             src/canary/ponsE2RecoveryReconcile.ts
          echo "PONS_E2_NO_LIVE_AUTHORITY_BOUNDARY_PASS"
