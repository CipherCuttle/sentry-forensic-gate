name: canary-e0-revoke-broadcast-authority-compat-r0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/canary/viemCanaryExecutor.ts'
      - 'src/canary/entryApprovalStore.ts'
      - 'src/canary/cycle.ts'
      - 'scripts/canary-e0-revoke-broadcast-authority-compat-r0-check.mjs'
      - '.github/workflows/canary-e0-revoke-broadcast-authority-compat-r0.yml'

permissions:
  contents: read

jobs:
  qualify-revoke-broadcast-authority-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm build
      - name: Preserve narrow canary wallet authority
        run: node scripts/canary-boundary-check.mjs
      - name: Assert no live wallet secret or live mode in CI
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CANARY_PRIVATE_KEY:-}"
          test "${CANARY_LIVE:-false}" = "false"
      - name: Qualify repaired revoke broadcast authority
        run: node scripts/canary-e0-revoke-broadcast-authority-compat-r0-check.mjs
