name: pons-v2-m2i-capacity-divergence-scout

on:
  push:
    branches:
      - agent/m2i-capacity-divergence-scout-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PONS_M2I_UPSTREAM_RPC_URL: 'https://rpc.nodeflare.app/robinhood/public'
      PONS_M2I_ACQUISITION_DIR: 'artifacts/m2i-acquisition'
      PONS_M2I_ACQUIRE_RPC_URL: 'http://127.0.0.1:18547'
      PONS_M2I_REPLAY_RPC_URL: 'http://127.0.0.1:18548'
      PONS_M2I_SCAN_BACK_BLOCKS: '30000'
      PONS_M2I_MAX_CANDIDATES: '12'
      PONS_M2I_RPC_MIN_INTERVAL_MS: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: node --check scripts/pons-v2-m2i-capacity-divergence-scout.mjs

      - name: Materialize workflow-only record/replay helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/m2h-e-rpc-record-replay.py" <<'PY'
          #!/usr/bin/env python3
          import argparse
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          
          SCHEMA = "ROBINHOOD_PONS_M2H_E_RPC_RECORD_REPLAY/1.0"
          
          def canonical_request(method, params):
              return json.dumps(
                  {"method": method, "params": params if params is not None else []},
                  sort_keys=True,
                  separators=(",", ":"),
              )
          
          def request_key(method, params):
              raw = canonical_request(method, params).encode()
              return hashlib.sha256(raw).hexdigest()
          
          def load_cache(path):
              if not os.path.exists(path):
                  return {"schema": SCHEMA, "entries": {}}
              with open(path, "r", encoding="utf-8") as fh:
                  data = json.load(fh)
              if data.get("schema") != SCHEMA or not isinstance(data.get("entries"), dict):
                  raise RuntimeError("M2H_E_RPC_CACHE_INVALID")
              return data
          
          def save_cache(path, data):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              tmp = path + ".tmp"
              with open(tmp, "w", encoding="utf-8") as fh:
                  json.dump(data, fh, indent=2, sort_keys=True)
                  fh.write("\n")
              os.replace(tmp, path)
          
          class State:
              def __init__(self, args):
                  self.mode = args.mode
                  self.cache_path = args.cache
                  self.upstream = args.upstream
                  self.min_interval = args.min_interval_ms / 1000.0
                  self.cache = load_cache(self.cache_path)
                  self.lock = threading.Lock()
                  self.last_started = 0.0
          
              def upstream_call(self, body_text):
                  now = time.monotonic()
                  wait = max(0.0, self.last_started + self.min_interval - now)
                  if wait > 0:
                      time.sleep(wait)
                  self.last_started = time.monotonic()
          
                  with tempfile.NamedTemporaryFile(delete=False) as tmp:
                      body_path = tmp.name
                  try:
                      proc = subprocess.run(
                          [
                              "curl",
                              "--silent",
                              "--show-error",
                              "--location",
                              "--connect-timeout", "10",
                              "--max-time", "40",
                              "--retry", "4",
                              "--retry-delay", "3",
                              "--retry-all-errors",
                              "--header", "content-type: application/json",
                              "--header", "user-agent: sentry-forensic-gate-m2h-archive-probe/3",
                              "--output", body_path,
                              "--write-out", "%{http_code}",
                              "--data-binary", body_text,
                              self.upstream,
                          ],
                          check=False,
                          text=True,
                          capture_output=True,
                      )
                      try:
                          with open(body_path, "r", encoding="utf-8") as fh:
                              response_text = fh.read()
                      except Exception:
                          response_text = ""
                      status_text = (proc.stdout or "").strip()
                      status = int(status_text) if status_text.isdigit() else 0
                      return proc.returncode, status, response_text, (proc.stderr or "")[:1024]
                  finally:
                      try:
                          os.unlink(body_path)
                      except FileNotFoundError:
                          pass
          
              def handle_rpc(self, request_obj):
                  if not isinstance(request_obj, dict):
                      raise RuntimeError("M2H_E_RPC_REQUEST_NOT_OBJECT")
                  method = request_obj.get("method")
                  params = request_obj.get("params", [])
                  rpc_id = request_obj.get("id")
                  if not isinstance(method, str) or not isinstance(params, list):
                      raise RuntimeError("M2H_E_RPC_REQUEST_INVALID")
          
                  key = request_key(method, params)
                  with self.lock:
                      entry = self.cache["entries"].get(key)
                      if entry is None and self.mode == "acquire":
                          upstream_body = json.dumps(
                              {"jsonrpc": "2.0", "id": 1, "method": method, "params": params},
                              separators=(",", ":"),
                          )
                          returncode, status, response_text, stderr = self.upstream_call(upstream_body)
                          parsed = None
                          try:
                              parsed = json.loads(response_text)
                          except Exception:
                              parsed = None
                          entry = {
                              "request": {"method": method, "params": params},
                              "transport": {
                                  "curlReturnCode": returncode,
                                  "httpStatus": status,
                                  "stderr": stderr,
                              },
                              "rawResponseText": response_text,
                              "parsedResponse": parsed,
                          }
                          self.cache["entries"][key] = entry
                          save_cache(self.cache_path, self.cache)
          
                      if entry is None:
                          return {
                              "jsonrpc": "2.0",
                              "id": rpc_id,
                              "error": {
                                  "code": -32098,
                                  "message": "M2H_E_REPLAY_CACHE_MISS",
                                  "data": {"requestKey": key, "method": method},
                              },
                          }
          
                      transport = entry.get("transport", {})
                      parsed = entry.get("parsedResponse")
                      if (
                          transport.get("curlReturnCode") != 0
                          or not isinstance(transport.get("httpStatus"), int)
                          or transport.get("httpStatus", 0) < 200
                          or transport.get("httpStatus", 0) >= 300
                          or not isinstance(parsed, dict)
                      ):
                          return {
                              "jsonrpc": "2.0",
                              "id": rpc_id,
                              "error": {
                                  "code": -32097,
                                  "message": "M2H_E_RECORDED_TRANSPORT_FAILURE",
                                  "data": {
                                      "requestKey": key,
                                      "httpStatus": transport.get("httpStatus"),
                                      "curlReturnCode": transport.get("curlReturnCode"),
                                  },
                              },
                          }
          
                      if "error" in parsed:
                          return {"jsonrpc": "2.0", "id": rpc_id, "error": parsed["error"]}
                      if "result" not in parsed:
                          return {
                              "jsonrpc": "2.0",
                              "id": rpc_id,
                              "error": {
                                  "code": -32096,
                                  "message": "M2H_E_RECORDED_RESULT_MISSING",
                                  "data": {"requestKey": key},
                              },
                          }
                      return {"jsonrpc": "2.0", "id": rpc_id, "result": parsed["result"]}
          
          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--mode", choices=["acquire", "replay"], required=True)
              parser.add_argument("--cache", required=True)
              parser.add_argument("--port", type=int, required=True)
              parser.add_argument("--upstream", default="")
              parser.add_argument("--min-interval-ms", type=int, default=650)
              args = parser.parse_args()
          
              if args.mode == "acquire" and not args.upstream:
                  raise SystemExit("M2H_E_UPSTREAM_REQUIRED")
              state = State(args)
          
              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, fmt, *args):
                      return
          
                  def do_GET(self):
                      if self.path != "/health":
                          self.send_response(404)
                          self.end_headers()
                          return
                      body = json.dumps({
                          "schema": SCHEMA,
                          "mode": state.mode,
                          "entries": len(state.cache["entries"]),
                      }).encode()
                      self.send_response(200)
                      self.send_header("content-type", "application/json")
                      self.send_header("content-length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
          
                  def do_POST(self):
                      length = int(self.headers.get("content-length", "0"))
                      raw = self.rfile.read(length)
                      try:
                          request_obj = json.loads(raw.decode("utf-8"))
                          if isinstance(request_obj, list):
                              raise RuntimeError("M2H_E_RPC_BATCH_UNSUPPORTED")
                          response_obj = state.handle_rpc(request_obj)
                          body = json.dumps(response_obj, separators=(",", ":")).encode()
                          self.send_response(200)
                      except Exception as exc:
                          body = json.dumps({
                              "jsonrpc": "2.0",
                              "id": None,
                              "error": {"code": -32603, "message": str(exc)[:512]},
                          }, separators=(",", ":")).encode()
                          self.send_response(500)
                      self.send_header("content-type", "application/json")
                      self.send_header("content-length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
          
              server = ThreadingHTTPServer(("127.0.0.1", args.port), Handler)
              server.serve_forever()
          
          if __name__ == "__main__":
              main()
          
          PY
          chmod 700 "${RUNNER_TEMP}/m2h-e-rpc-record-replay.py"


      - name: Acquire exact prospective scout evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PONS_M2I_ACQUISITION_DIR}"
          cache="${PONS_M2I_ACQUISITION_DIR}/rpc-cache.json"

          python3 "${RUNNER_TEMP}/m2h-e-rpc-record-replay.py" \
            --mode acquire \
            --cache "${cache}" \
            --port 18547 \
            --upstream "${PONS_M2I_UPSTREAM_RPC_URL}" \
            --min-interval-ms 650 \
            > "${PONS_M2I_ACQUISITION_DIR}/acquire-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "${proxy_pid}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:18547/health >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:18547/health \
            > "${PONS_M2I_ACQUISITION_DIR}/acquire-health.json"

          PONS_M2I_RPC_URL="${PONS_M2I_ACQUIRE_RPC_URL}" \
            node scripts/pons-v2-m2i-capacity-divergence-scout.mjs \
            > "${PONS_M2I_ACQUISITION_DIR}/acquisition-driver-output.json"

          kill "${proxy_pid}"
          wait "${proxy_pid}" 2>/dev/null || true
          trap - EXIT

          sha256sum "${cache}" > "${PONS_M2I_ACQUISITION_DIR}/rpc-cache.sha256"
          jq -e '.schema == "ROBINHOOD_PONS_M2H_E_RPC_RECORD_REPLAY/1.0" and (.entries | length) > 0' \
            "${cache}" >/dev/null

      - name: Replay and freeze authoritative capacity-divergence selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cache="${PONS_M2I_ACQUISITION_DIR}/rpc-cache.json"
          before="$(sha256sum "${cache}" | awk '{print $1}')"

          python3 "${RUNNER_TEMP}/m2h-e-rpc-record-replay.py" \
            --mode replay \
            --cache "${cache}" \
            --port 18548 \
            > "${PONS_M2I_ACQUISITION_DIR}/replay-proxy.log" 2>&1 &
          replay_pid=$!
          trap 'kill "${replay_pid}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:18548/health >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:18548/health \
            > "${PONS_M2I_ACQUISITION_DIR}/replay-health.json"

          PONS_M2I_RPC_URL="${PONS_M2I_REPLAY_RPC_URL}" \
            node scripts/pons-v2-m2i-capacity-divergence-scout.mjs \
            | tee artifacts/m2i-capacity-divergence-selection.json

          PONS_M2I_RPC_URL="${PONS_M2I_REPLAY_RPC_URL}" \
            node scripts/pons-v2-m2i-capacity-divergence-scout.mjs \
            > artifacts/m2i-capacity-divergence-selection-replay-2.json

          cmp \
            artifacts/m2i-capacity-divergence-selection.json \
            artifacts/m2i-capacity-divergence-selection-replay-2.json

          after="$(sha256sum "${cache}" | awk '{print $1}')"
          test "${before}" = "${after}"

          jq -e '
            .mode == "SHADOW_ONLY" and
            .edge == "UNPROVEN" and
            .boundaries.wallet == false and
            .boundaries.signer == false and
            .boundaries.broadcast == false and
            .boundaries.liveMoney == false and
            .boundaries.robinhoodLiveAuthority == false and
            .boundaries.arcLiveAuthority == false and
            .boundaries.outcomeObservedDuringSelection == false and
            (
              .verdict == "NO_CAPACITY_DIVERGENCE_IN_BOUNDED_WINDOW" or
              (
                .verdict == "CAPACITY_DIVERGENCE_CANDIDATE_FROZEN" and
                .frozenCandidate.targetTimestampMs > .selection.headTimestampMs and
                .frozenCandidate.policyComparison.receipts.r0.hypotheticalAction == "WOULD_SKIP" and
                (
                  (.frozenCandidate.policyComparison.receipts.r0.reasons | index("PRIMARY_ENTRY_NOT_EXECUTABLE")) != null or
                  (.frozenCandidate.policyComparison.receipts.r0.reasons | index("PRIMARY_REVERSE_NOT_EXECUTABLE")) != null
                ) and
                .frozenCandidate.policyComparison.receipts.r1.hypotheticalAction == "WOULD_TRADE" and
                .frozenCandidate.policyComparison.receipts.buyEveryExecutableControl.hypotheticalAction == "WOULD_TRADE" and
                (.frozenCandidate.policyComparison.receipts.r1.capacityUsdMicros | tonumber) < 1000000
              )
            )
          ' artifacts/m2i-capacity-divergence-selection.json >/dev/null

          kill "${replay_pid}"
          wait "${replay_pid}" 2>/dev/null || true
          trap - EXIT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pons-v2-m2i-capacity-divergence-scout
          path: artifacts/
          if-no-files-found: error
