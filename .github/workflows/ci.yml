name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - name: Validate Dev Spine metadata
        run: node scripts/dev-spine-check.mjs
      - name: Enforce supported execution surfaces
        run: node scripts/research-boundary-package-check.mjs
      - name: Test research-only guardrails
        run: pnpm --package=@ast-grep/cli@0.45.0 dlx ast-grep test --skip-snapshot-tests
      - name: Enforce research-only guardrails
        run: pnpm --package=@ast-grep/cli@0.45.0 dlx ast-grep scan
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm test
      - name: Generate Dev Spine evidence
        if: always()
        env:
          DEV_SPINE_CI_STATUS: ${{ job.status }}
          DEV_SPINE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/dev-spine-pack.mjs
          node scripts/dev-spine-receipt.mjs
      - name: Upload Dev Spine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-spine-${{ github.sha }}
          path: .dev-spine/
          if-no-files-found: error
