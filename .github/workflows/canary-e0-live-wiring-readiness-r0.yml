name: canary-e0-live-wiring-readiness-r0
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/canary/store.ts'
      - 'src/canary/roundTripWiring.ts'
      - 'src/canarySniperCli.ts'
      - 'scripts/canary-e0-live-wiring-readiness-r0-check.mjs'
      - '.github/workflows/canary-e0-live-wiring-readiness-r0.yml'

permissions:
  contents: read

jobs:
  qualify-live-wiring-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm build
      - name: Preserve narrow canary wallet authority
        run: node scripts/canary-boundary-check.mjs
      - name: Preserve research-only boundary outside executor
        run: pnpm --package=@ast-grep/cli@0.45.0 dlx ast-grep scan
      - name: Assert no live wallet secret or live mode in CI
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CANARY_PRIVATE_KEY:-}"
          test "${CANARY_LIVE:-false}" = "false"
          echo 'CANARY_E0_LIVE_WIRING_NO_SECRET=PASS'
      - name: Qualify post-buy wiring offline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/canary-e0-live-wiring-readiness-r0-check.mjs | tee canary-e0-live-wiring-readiness-r0.json
          grep -q '"verdict": "CANARY_E0_LIVE_WIRING_READINESS_R0_PASS"' canary-e0-live-wiring-readiness-r0.json
          grep -q '"bankrollUsd": 40' canary-e0-live-wiring-readiness-r0.json
          grep -q '"fixedPrimaryTradeUsd": 1' canary-e0-live-wiring-readiness-r0.json
          grep -q '"validationLossBudgetUsd": 5' canary-e0-live-wiring-readiness-r0.json
          grep -q '"persistedCommittedBuyRehydrated": true' canary-e0-live-wiring-readiness-r0.json
          grep -q '"buyPollDefersRoundTripSideEffect": true' canary-e0-live-wiring-readiness-r0.json
          grep -q '"oneChildTransactionPerPoll": true' canary-e0-live-wiring-readiness-r0.json
          grep -q '"cliLiveRoundTripKillSwitch": true' canary-e0-live-wiring-readiness-r0.json
          grep -q '"networkBroadcastInvoked": false' canary-e0-live-wiring-readiness-r0.json
          grep -q '"liveRoundTripReachable": false' canary-e0-live-wiring-readiness-r0.json
      - uses: actions/upload-artifact@v4
        with:
          name: canary-e0-live-wiring-readiness-r0-evidence
          path: canary-e0-live-wiring-readiness-r0.json
          if-no-files-found: error
