name: historical-baseline-policy-r1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/HISTORICAL_BASELINE_POLICY_R1.md'
      - 'docs/agent-packets/HISTORICAL_BASELINE_POLICY_R1.json'
      - 'fixtures/historical-compatibility-r1.json'
      - 'scripts/historical-baseline-policy-probe.mjs'
      - 'scripts/dev-spine-check.mjs'
      - 'scripts/dev-spine-check-test.mjs'
      - 'scripts/dev-spine-context.mjs'
      - 'scripts/dev-spine-pack.mjs'
      - 'scripts/dev-spine-receipt.mjs'
      - '.github/workflows/historical-baseline-policy-r1.yml'

jobs:
  live-point-in-time-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm build
      - name: Probe historical calibration surface
        env:
          SHADOW_ONLY: 'true'
        run: node scripts/historical-baseline-policy-probe.mjs
