name: canary-e0-entry-approval-revoke-r0
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/canary/entryApprovalRevoke.ts'
      - 'src/canary/entryApprovalRevokeStore.ts'
      - 'src/canary/entryApprovalRevokeRuntime.ts'
      - 'src/canary/viemCanaryExecutor.ts'
      - 'scripts/canary-e0-entry-approval-revoke-r0-check.mjs'
      - '.github/workflows/canary-e0-entry-approval-revoke-r0.yml'

permissions:
  contents: read

jobs:
  qualify-entry-approval-revoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm build
      - name: Preserve narrow canary wallet authority
        run: node scripts/canary-boundary-check.mjs
      - name: Preserve research-only boundary outside executor
        run: pnpm --package=@ast-grep/cli@0.45.0 dlx ast-grep scan
      - name: Assert no live wallet secret or live mode in CI
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CANARY_PRIVATE_KEY:-}"
          test "${CANARY_LIVE:-false}" = "false"
          echo 'CANARY_E0_ENTRY_APPROVAL_REVOKE_NO_SECRET=PASS'
      - name: Qualify exact revoke lifecycle offline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/canary-e0-entry-approval-revoke-r0-check.mjs | tee canary-e0-entry-approval-revoke-r0.json
          grep -q '"verdict": "CANARY_E0_ENTRY_APPROVAL_REVOKE_R0_PASS"' canary-e0-entry-approval-revoke-r0.json
          grep -q '"revokeAmount": "0"' canary-e0-entry-approval-revoke-r0.json
          grep -q '"exactParentAllowanceRequired": true' canary-e0-entry-approval-revoke-r0.json
          grep -q '"widenedAllowanceBlocked": true' canary-e0-entry-approval-revoke-r0.json
          grep -q '"zeroBeforeRevokeIsNoop": true' canary-e0-entry-approval-revoke-r0.json
          grep -q '"tokenBalanceIndependent": true' canary-e0-entry-approval-revoke-r0.json
          grep -q '"allowanceRaceBeforeSignBlocked": true' canary-e0-entry-approval-revoke-r0.json
          grep -q '"postIncludeAllowanceMustBeZero": true' canary-e0-entry-approval-revoke-r0.json
          grep -q '"knownHashNoResignRebroadcast": true' canary-e0-entry-approval-revoke-r0.json
          grep -q '"sameViemCanaryExecutorUsed": true' canary-e0-entry-approval-revoke-r0.json
          grep -q '"cycleWiringAdded": false' canary-e0-entry-approval-revoke-r0.json
          grep -q '"cliWiringAdded": false' canary-e0-entry-approval-revoke-r0.json
          grep -q '"networkBroadcastInvoked": false' canary-e0-entry-approval-revoke-r0.json
          grep -q '"liveCleanupReachable": false' canary-e0-entry-approval-revoke-r0.json
      - uses: actions/upload-artifact@v4
        with:
          name: canary-e0-entry-approval-revoke-r0-evidence
          path: canary-e0-entry-approval-revoke-r0.json
          if-no-files-found: error
