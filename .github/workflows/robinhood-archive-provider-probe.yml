name: robinhood-archive-provider-probe

on:
  push:
    branches:
      - agent/m2h-pons-archive-provider-probe-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe historical Robinhood state/logs
        run: node scripts/robinhood-archive-provider-probe.mjs
