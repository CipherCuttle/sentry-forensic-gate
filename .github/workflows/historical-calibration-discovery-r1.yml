name: historical-calibration-discovery-r1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/historical-calibration-factory-scan.mjs'
      - '.github/workflows/historical-calibration-discovery-r1.yml'

jobs:
  scan-historical-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - name: Exhaustively scan historical factory WETH pairs before first failing decision block
        run: node scripts/historical-calibration-factory-scan.mjs
