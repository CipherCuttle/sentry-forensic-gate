name: canary-e0-approval-executor-r0

on:
  push:
    branches:
      - agent/canary-e0-approval-executor-r0
    paths:
      - 'src/canary/viemCanaryExecutor.ts'
      - 'src/canary/approval.ts'
      - 'src/canary/approvalStore.ts'
      - 'scripts/canary-boundary-check.mjs'
      - 'scripts/canary-e0-approval-executor-r0-check.mjs'
      - '.github/workflows/canary-e0-approval-executor-r0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-approval-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile --lockfile=false
      - run: pnpm build
      - name: Preserve narrow wallet-authority boundary
        run: node scripts/canary-boundary-check.mjs
      - name: Assert no live wallet secret or live mode
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          test -z "${CANARY_PRIVATE_KEY:-}"
          test "${CANARY_LIVE:-false}" = "false"
          echo 'CANARY_E0_APPROVAL_EXECUTOR_NO_LIVE_SECRET=PASS'
      - name: Qualify approval executor offline
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          node scripts/canary-e0-approval-executor-r0-check.mjs | tee canary-e0-approval-executor-r0.json
          grep -q '"verdict": "CANARY_E0_APPROVAL_EXECUTOR_R0_PASS"' canary-e0-approval-executor-r0.json
          grep -q '"preBroadcastMutationBlockedBeforeSideEffect": true' canary-e0-approval-executor-r0.json
          grep -q '"networkBroadcastInvoked": false' canary-e0-approval-executor-r0.json
          grep -q '"live": false' canary-e0-approval-executor-r0.json
          grep -q '"walletSecretUsed": false' canary-e0-approval-executor-r0.json
      - uses: actions/upload-artifact@v4
        with:
          name: canary-e0-approval-executor-r0-evidence
          path: canary-e0-approval-executor-r0.json
          if-no-files-found: error
