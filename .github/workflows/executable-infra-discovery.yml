name: executable-infra-discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/executable-infra-discovery.yml'
      - 'src/executableInfraDiscoveryCli.ts'
      - 'src/authority/**'
      - 'src/sentry/contracts.ts'
      - 'src/tsunami/contracts.ts'
      - 'package.json'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Discover executable infrastructure sub-epochs
        env:
          INFRA_DISCOVERY_MAX_BATCH_BLOCKS: '10000'
        run: pnpm start:infra-discovery
