name: pons-s0-real-cohort-materialization-v1

on:
  push:
    branches:
      - agent/pons-s0-real-cohort-materialization-v1
    paths:
      - scripts/pons-s0-real-cohort-materialize.mjs
      - .github/workflows/pons-s0-real-cohort-materialization-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PONS_S0_SOURCE_COMMIT: '493c85b8d84565cedf6e936063549edfa02edf3a'
      PONS_S0_UPSTREAM_RPC_URL: 'https://rpc.nodeflare.app/robinhood/public'
      PONS_S0_RPC_URL: 'http://127.0.0.1:18547'
      PONS_S0_RPC_MIN_INTERVAL_MS: '650'
      PONS_S0_CONFIRMATIONS: '12'
      PONS_S0_LOG_CHUNK_BLOCKS: '1000000'
      PONS_S0_COHORT_TARGET_COUNT: '96'
      PONS_S0_BLOCKSCOUT_BASE: 'https://robinhoodchain.blockscout.com'
      PONS_S0_FACTORY: '0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e'
      PONS_S0_EVENT_TOPIC: '0x8d4aad4953d0ca700d468f3753aa14432d1b35b43ec6409f051fb6aa43a89607'
      PONS_S0_AUTHORITY_FROM_BLOCK: '26841846'
    steps:
      - name: Checkout materialization harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness

      - name: Checkout exact reviewed SENTRY source
        uses: actions/checkout@v4
        with:
          ref: 493c85b8d84565cedf6e936063549edfa02edf3a
          path: source
          persist-credentials: false

      - name: Preflight NodeFlare archive transport with curl
        shell: bash
        run: |
          set -euo pipefail
          rpc_call() {
            curl --fail --silent --show-error --location               --connect-timeout 10 --max-time 45               --retry 4 --retry-delay 3 --retry-all-errors               --user-agent 'sentry-forensic-gate-pons-s0-archive-probe/1'               --header 'content-type: application/json'               --data-binary "$1"               "${PONS_S0_UPSTREAM_RPC_URL}"
          }

          chain_response="$(rpc_call '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}')"
          jq -e '.result == "0x1237"' <<<"${chain_response}" >/dev/null

          archive_response="$(rpc_call '{"jsonrpc":"2.0","id":2,"method":"eth_getCode","params":["0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e","0x3ded702"]}')"
          jq -e '.result | type == "string" and startswith("0x") and length > 2' <<<"${archive_response}" >/dev/null

      - name: Acquire complete indexed Pons launch chronology
        shell: bash
        env:
          PONS_S0_LAUNCH_INDEX_PATH: ${{ github.workspace }}/blockscout-launch-index.json
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/pons-s0-blockscout-index.py" <<'PY'
          #!/usr/bin/env python3
          import argparse
          import json
          import subprocess
          import time

          MAX_RESULTS = 1000

          def curl_json(args, attempts=8):
              last = None
              for attempt in range(attempts):
                  proc = subprocess.run(
                      [
                          "curl",
                          "--fail",
                          "--silent",
                          "--show-error",
                          "--location",
                          "--connect-timeout", "10",
                          "--max-time", "90",
                          "--retry", "3",
                          "--retry-delay", "2",
                          "--retry-all-errors",
                          "--user-agent",
                          "Mozilla/5.0 (compatible; SentryForensicGate/0.7; +https://github.com/CipherCuttle/sentry-forensic-gate)",
                          "--header", "Accept: application/json",
                          *args,
                      ],
                      check=False,
                      text=True,
                      capture_output=True,
                  )
                  if proc.returncode == 0:
                      try:
                          value = json.loads(proc.stdout)
                      except Exception as exc:
                          last = RuntimeError("BLOCKSCOUT_NON_JSON:" + str(exc))
                      else:
                          return value
                  else:
                      last = RuntimeError(
                          "BLOCKSCOUT_CURL_FAILURE:"
                          + str(proc.returncode)
                          + ":"
                          + (proc.stderr or "")[:512]
                      )
                  time.sleep(min(15, 2 + attempt * 2))
              raise last or RuntimeError("BLOCKSCOUT_REQUEST_FAILED")

          def rpc_head(upstream):
              value = curl_json([
                  "--header", "content-type: application/json",
                  "--data-binary",
                  '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}',
                  upstream,
              ])
              result = value.get("result") if isinstance(value, dict) else None
              if not isinstance(result, str) or not result.startswith("0x"):
                  raise RuntimeError("NODEFLARE_HEAD_INVALID")
              return int(result, 16)

          def blockscout_head(base):
              value = curl_json([base + "/api/v2/blocks?type=block"])
              items = value.get("items") if isinstance(value, dict) else None
              if not isinstance(items, list) or not items:
                  raise RuntimeError("BLOCKSCOUT_HEAD_MISSING")
              first = items[0]
              if not isinstance(first, dict):
                  raise RuntimeError("BLOCKSCOUT_HEAD_INVALID")
              height = first.get("height")
              if isinstance(height, int):
                  return height
              if isinstance(height, str) and height.isdigit():
                  return int(height)
              raise RuntimeError("BLOCKSCOUT_HEAD_HEIGHT_INVALID")

          def query_logs(base, factory, topic0, start, end, counter):
              # Blockscout's public API rate-limits sustained recursive scans.
              # Use the same conservative cadence that previously proved
              # creator-history acquisition on this explorer.
              time.sleep(15)
              counter[0] += 1
              value = curl_json([
                  "--get",
                  base + "/api",
                  "--data-urlencode", "module=logs",
                  "--data-urlencode", "action=getLogs",
                  "--data-urlencode", "fromBlock=" + str(start),
                  "--data-urlencode", "toBlock=" + str(end),
                  "--data-urlencode", "address=" + factory,
                  "--data-urlencode", "topic0=" + topic0,
                  "--data-urlencode", "page=1",
                  "--data-urlencode", "offset=" + str(MAX_RESULTS),
              ])
              if not isinstance(value, dict):
                  raise RuntimeError("BLOCKSCOUT_LOG_RESPONSE_INVALID")
              result = value.get("result")
              if isinstance(result, list):
                  items = result
              elif (
                  str(value.get("status")) == "0"
                  and isinstance(result, str)
                  and (
                      "no" in result.lower()
                      or "not found" in result.lower()
                  )
              ):
                  items = []
              else:
                  raise RuntimeError(
                      "BLOCKSCOUT_LOG_API_FAILURE:"
                      + json.dumps(value, sort_keys=True)[:1024]
                  )

              if len(items) >= MAX_RESULTS:
                  if start == end:
                      raise RuntimeError(
                          "BLOCKSCOUT_SINGLE_BLOCK_LOG_OVERFLOW:" + str(start)
                      )
                  mid = start + (end - start) // 2
                  return (
                      query_logs(base, factory, topic0, start, mid, counter)
                      + query_logs(base, factory, topic0, mid + 1, end, counter)
                  )
              return items

          def quantity(value, label):
              if isinstance(value, int):
                  return value
              if not isinstance(value, str):
                  raise RuntimeError(label + "_INVALID")
              if value.startswith("0x"):
                  return int(value, 16)
              return int(value, 10)

          def topic_address(topic, label):
              if not isinstance(topic, str) or len(topic) != 66 or not topic.startswith("0x"):
                  raise RuntimeError(label + "_INVALID")
              return "0x" + topic[-40:].lower()

          def normalize(item, factory, topic0):
              if not isinstance(item, dict):
                  raise RuntimeError("BLOCKSCOUT_LOG_ITEM_INVALID")
              address = str(item.get("address", "")).lower()
              if address != factory.lower():
                  raise RuntimeError("BLOCKSCOUT_LOG_FACTORY_MISMATCH")
              topics = item.get("topics")
              if not isinstance(topics, list) or len(topics) < 4:
                  raise RuntimeError("BLOCKSCOUT_LOG_TOPICS_INVALID")
              if str(topics[0]).lower() != topic0.lower():
                  raise RuntimeError("BLOCKSCOUT_LOG_TOPIC0_MISMATCH")
              tx_hash = str(item.get("transactionHash", ""))
              if len(tx_hash) != 66 or not tx_hash.startswith("0x"):
                  raise RuntimeError("BLOCKSCOUT_LOG_TX_INVALID")
              data = str(item.get("data", ""))
              if not data.startswith("0x"):
                  raise RuntimeError("BLOCKSCOUT_LOG_DATA_INVALID")
              block_number = quantity(item.get("blockNumber"), "BLOCK_NUMBER")
              log_index = quantity(item.get("logIndex"), "LOG_INDEX")
              tx_index = quantity(item.get("transactionIndex", "0x0"), "TX_INDEX")
              return {
                  "blockNumber": str(block_number),
                  "transactionHash": tx_hash.lower(),
                  "transactionIndex": tx_index,
                  "logIndex": log_index,
                  "address": address,
                  "topics": [str(topic).lower() for topic in topics],
                  "data": data.lower(),
                  "token": topic_address(topics[1], "TOKEN_TOPIC"),
                  "deployer": topic_address(topics[3], "DEPLOYER_TOPIC"),
              }

          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--base", required=True)
              parser.add_argument("--upstream", required=True)
              parser.add_argument("--factory", required=True)
              parser.add_argument("--topic0", required=True)
              parser.add_argument("--from-block", type=int, required=True)
              parser.add_argument("--chunk-blocks", type=int, default=1_000_000)
              parser.add_argument("--output", required=True)
              args = parser.parse_args()

              upstream_head = rpc_head(args.upstream)
              indexed_head = blockscout_head(args.base)
              through = min(upstream_head, indexed_head)
              if through < args.from_block:
                  raise RuntimeError("BLOCKSCOUT_INDEX_BEFORE_AUTHORITY_EPOCH")

              raw = []
              counter = [0]
              start = args.from_block
              while start <= through:
                  end = min(through, start + args.chunk_blocks - 1)
                  raw.extend(
                      query_logs(
                          args.base,
                          args.factory,
                          args.topic0,
                          start,
                          end,
                          counter,
                      )
                  )
                  start = end + 1
                  time.sleep(1)

              normalized = [
                  normalize(item, args.factory, args.topic0)
                  for item in raw
              ]
              normalized.sort(
                  key=lambda row: (
                      int(row["blockNumber"]),
                      row["logIndex"],
                      row["transactionHash"],
                  )
              )
              seen = set()
              for row in normalized:
                  key = (
                      row["blockNumber"],
                      row["transactionHash"],
                      row["logIndex"],
                  )
                  if key in seen:
                      raise RuntimeError(
                          "BLOCKSCOUT_DUPLICATE_LAUNCH_LOG:" + str(key)
                      )
                  seen.add(key)

              receipt = {
                  "schema": "ROBINHOOD_BLOCKSCOUT_PONS_S0_LAUNCH_INDEX_V1",
                  "factory": args.factory.lower(),
                  "eventTopic": args.topic0.lower(),
                  "scannedFromBlock": str(args.from_block),
                  "scannedThroughBlock": str(through),
                  "blockscoutIndexedHeadBlock": str(indexed_head),
                  "upstreamObservedHeadBlock": str(upstream_head),
                  "queryCount": counter[0],
                  "adaptiveOverflowSplit": True,
                  "maxResultsPerQuery": MAX_RESULTS,
                  "launchCount": len(normalized),
                  "logs": normalized,
              }
              with open(args.output, "w", encoding="utf-8") as fh:
                  json.dump(
                      receipt,
                      fh,
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  fh.write("\n")
              print(json.dumps({
                  "launchCount": len(normalized),
                  "queryCount": counter[0],
                  "scannedThroughBlock": through,
                  "blockscoutIndexedHeadBlock": indexed_head,
                  "upstreamObservedHeadBlock": upstream_head,
              }, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY
          chmod 700 "${RUNNER_TEMP}/pons-s0-blockscout-index.py"

          python3 "${RUNNER_TEMP}/pons-s0-blockscout-index.py"             --base "${PONS_S0_BLOCKSCOUT_BASE}"             --upstream "${PONS_S0_UPSTREAM_RPC_URL}"             --factory "${PONS_S0_FACTORY}"             --topic0 "${PONS_S0_EVENT_TOPIC}"             --from-block "${PONS_S0_AUTHORITY_FROM_BLOCK}"             --chunk-blocks "${PONS_S0_LOG_CHUNK_BLOCKS}"             --output "${PONS_S0_LAUNCH_INDEX_PATH}"             | tee "${GITHUB_WORKSPACE}/blockscout-launch-index-summary.json"

          test -s "${PONS_S0_LAUNCH_INDEX_PATH}"
          jq -e '
            .schema == "ROBINHOOD_BLOCKSCOUT_PONS_S0_LAUNCH_INDEX_V1" and
            .launchCount > 0 and
            (.logs | length) == .launchCount and
            .adaptiveOverflowSplit == true
          ' "${PONS_S0_LAUNCH_INDEX_PATH}" >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build exact reviewed SENTRY source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${PONS_S0_SOURCE_COMMIT}"
          corepack enable
          cd source
          pnpm install --no-frozen-lockfile
          pnpm build
          test "$(git rev-parse HEAD)" = "${PONS_S0_SOURCE_COMMIT}"

      - name: Materialize target-blind Pons S0 cohort
        shell: bash
        env:
          PONS_S0_OUTPUT_DIR: ${{ github.workspace }}/cohort
          PONS_S0_HARNESS_REPOSITORY: ${{ github.repository }}
          PONS_S0_HARNESS_COMMIT: ${{ github.sha }}
          PONS_S0_LAUNCH_LOGS_PATH: ${{ github.workspace }}/blockscout-launch-index.json
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/pons-s0-curl-rpc-proxy.py" <<'PY'
          #!/usr/bin/env python3
          import argparse
          import json
          import os
          import subprocess
          import tempfile
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          def quantity(value, label):
              if isinstance(value, int):
                  return value
              if not isinstance(value, str):
                  raise RuntimeError(label + "_INVALID")
              if value.startswith("0x"):
                  return int(value, 16)
              return int(value, 10)

          def hex_quantity(value):
              return hex(int(value))

          class State:
              def __init__(self, args):
                  self.upstream = args.upstream
                  self.factory = args.factory.lower()
                  self.topic0 = args.topic0.lower()
                  with open(args.launch_index, "r", encoding="utf-8") as fh:
                      index = json.load(fh)
                  if index.get("schema") != "ROBINHOOD_BLOCKSCOUT_PONS_S0_LAUNCH_INDEX_V1":
                      raise RuntimeError("PROXY_LAUNCH_INDEX_SCHEMA_MISMATCH")
                  if str(index.get("factory", "")).lower() != self.factory:
                      raise RuntimeError("PROXY_LAUNCH_INDEX_FACTORY_MISMATCH")
                  if str(index.get("eventTopic", "")).lower() != self.topic0:
                      raise RuntimeError("PROXY_LAUNCH_INDEX_TOPIC_MISMATCH")
                  logs = index.get("logs")
                  if not isinstance(logs, list):
                      raise RuntimeError("PROXY_LAUNCH_INDEX_LOGS_MISSING")
                  self.logs = logs
                  self.lock = threading.Lock()
                  self.block_hash_cache = {}

              def upstream_call(self, request_obj):
                  raw = json.dumps(
                      request_obj,
                      separators=(",", ":"),
                  ).encode()
                  with tempfile.NamedTemporaryFile(delete=False) as tmp:
                      body_path = tmp.name
                  try:
                      proc = subprocess.run(
                          [
                              "curl",
                              "--silent",
                              "--show-error",
                              "--location",
                              "--connect-timeout", "10",
                              "--max-time", "90",
                              "--retry", "6",
                              "--retry-delay", "3",
                              "--retry-all-errors",
                              "--user-agent",
                              "sentry-forensic-gate-pons-s0-archive-proxy/2",
                              "--header", "content-type: application/json",
                              "--output", body_path,
                              "--write-out", "%{http_code}",
                              "--data-binary", raw.decode("utf-8"),
                              self.upstream,
                          ],
                          check=False,
                          text=True,
                          capture_output=True,
                      )
                      with open(body_path, "rb") as fh:
                          body = fh.read()
                      status_text = (proc.stdout or "").strip()
                      status = int(status_text) if status_text.isdigit() else 0
                      if proc.returncode != 0 or status < 200 or status >= 300:
                          raise RuntimeError(
                              "UPSTREAM_RPC_TRANSPORT_FAILURE:"
                              + str(proc.returncode)
                              + ":"
                              + str(status)
                              + ":"
                              + (proc.stderr or "")[:512]
                          )
                      parsed = json.loads(body.decode("utf-8"))
                      if not isinstance(parsed, dict):
                          raise RuntimeError("UPSTREAM_RPC_NON_JSON_OBJECT")
                      return parsed
                  finally:
                      try:
                          os.unlink(body_path)
                      except FileNotFoundError:
                          pass

              def block_hash(self, block_number):
                  key = int(block_number)
                  cached = self.block_hash_cache.get(key)
                  if cached:
                      return cached
                  response = self.upstream_call({
                      "jsonrpc": "2.0",
                      "id": 1,
                      "method": "eth_getBlockByNumber",
                      "params": [hex_quantity(key), False],
                  })
                  block = response.get("result")
                  if not isinstance(block, dict):
                      raise RuntimeError(
                          "PROXY_BLOCK_MISSING:" + str(key)
                      )
                  block_hash = block.get("hash")
                  if (
                      not isinstance(block_hash, str)
                      or len(block_hash) != 66
                      or not block_hash.startswith("0x")
                  ):
                      raise RuntimeError(
                          "PROXY_BLOCK_HASH_INVALID:" + str(key)
                      )
                  self.block_hash_cache[key] = block_hash.lower()
                  return block_hash.lower()

              def indexed_logs(self, request_obj):
                  params = request_obj.get("params")
                  if not isinstance(params, list) or len(params) != 1:
                      raise RuntimeError("PROXY_LOG_PARAMS_INVALID")
                  filt = params[0]
                  if not isinstance(filt, dict):
                      raise RuntimeError("PROXY_LOG_FILTER_INVALID")
                  if "blockHash" in filt:
                      raise RuntimeError("PROXY_BLOCK_HASH_LOG_QUERY_UNSUPPORTED")
                  address = str(filt.get("address", "")).lower()
                  topics = filt.get("topics")
                  if address != self.factory:
                      raise RuntimeError("PROXY_NON_PONS_LOG_ADDRESS")
                  if (
                      not isinstance(topics, list)
                      or not topics
                      or str(topics[0]).lower() != self.topic0
                  ):
                      raise RuntimeError("PROXY_NON_PONS_LOG_TOPIC")
                  if any(topic is not None for topic in topics[1:]):
                      raise RuntimeError("PROXY_INDEXED_TOPIC_FILTER_UNSUPPORTED")

                  start = quantity(
                      filt.get("fromBlock"),
                      "PROXY_FROM_BLOCK",
                  )
                  end = quantity(
                      filt.get("toBlock"),
                      "PROXY_TO_BLOCK",
                  )
                  if end < start:
                      return []
                  selected = [
                      item
                      for item in self.logs
                      if start <= int(item["blockNumber"]) <= end
                  ]

                  result = []
                  for item in selected:
                      block_number = int(item["blockNumber"])
                      result.append({
                          "address": str(item["address"]).lower(),
                          "topics": [
                              str(topic).lower()
                              for topic in item["topics"]
                          ],
                          "data": str(item["data"]).lower(),
                          "blockNumber": hex_quantity(block_number),
                          "transactionHash":
                              str(item["transactionHash"]).lower(),
                          "transactionIndex":
                              hex_quantity(item["transactionIndex"]),
                          "blockHash": self.block_hash(block_number),
                          "logIndex": hex_quantity(item["logIndex"]),
                          "removed": False,
                      })
                  return result

              def handle_rpc(self, request_obj):
                  if not isinstance(request_obj, dict):
                      raise RuntimeError("PROXY_RPC_REQUEST_INVALID")
                  method = request_obj.get("method")
                  if method == "eth_getLogs":
                      result = self.indexed_logs(request_obj)
                      return {
                          "jsonrpc": "2.0",
                          "id": request_obj.get("id"),
                          "result": result,
                      }
                  return self.upstream_call(request_obj)

          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--upstream", required=True)
              parser.add_argument("--launch-index", required=True)
              parser.add_argument("--factory", required=True)
              parser.add_argument("--topic0", required=True)
              parser.add_argument("--port", type=int, required=True)
              args = parser.parse_args()
              state = State(args)

              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, fmt, *args):
                      return

                  def do_GET(self):
                      if self.path != "/health":
                          self.send_response(404)
                          self.end_headers()
                          return
                      body = json.dumps({
                          "ok": True,
                          "indexedLaunchLogs": len(state.logs),
                          "blockHashCache": len(state.block_hash_cache),
                      }, separators=(",", ":")).encode()
                      self.send_response(200)
                      self.send_header("content-type", "application/json")
                      self.send_header("content-length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def do_POST(self):
                      length = int(self.headers.get("content-length", "0"))
                      raw = self.rfile.read(length)
                      try:
                          request_obj = json.loads(raw.decode("utf-8"))
                          if isinstance(request_obj, list):
                              raise RuntimeError("PROXY_RPC_BATCH_UNSUPPORTED")
                          with state.lock:
                              response_obj = state.handle_rpc(request_obj)
                          body = json.dumps(
                              response_obj,
                              separators=(",", ":"),
                          ).encode()
                          self.send_response(200)
                      except Exception as exc:
                          body = json.dumps({
                              "jsonrpc": "2.0",
                              "id": None,
                              "error": {
                                  "code": -32099,
                                  "message": str(exc)[:1024],
                              },
                          }, separators=(",", ":")).encode()
                          self.send_response(502)
                      self.send_header("content-type", "application/json")
                      self.send_header("content-length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              ThreadingHTTPServer(
                  ("127.0.0.1", args.port),
                  Handler,
              ).serve_forever()

          if __name__ == "__main__":
              main()
          PY
          chmod 700 "${RUNNER_TEMP}/pons-s0-curl-rpc-proxy.py"

          python3 "${RUNNER_TEMP}/pons-s0-curl-rpc-proxy.py"             --upstream "${PONS_S0_UPSTREAM_RPC_URL}"             --launch-index "${PONS_S0_LAUNCH_LOGS_PATH}"             --factory "${PONS_S0_FACTORY}"             --topic0 "${PONS_S0_EVENT_TOPIC}"             --port 18547             > "${GITHUB_WORKSPACE}/pons-s0-rpc-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "${proxy_pid}" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:18547/health >/dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:18547/health >/dev/null

          cp harness/scripts/pons-s0-real-cohort-materialize.mjs source/scripts/pons-s0-real-cohort-materialize.mjs
          cd source
          node scripts/pons-s0-real-cohort-materialize.mjs | tee "${GITHUB_WORKSPACE}/materialization.log"

          kill "${proxy_pid}"
          wait "${proxy_pid}" 2>/dev/null || true
          trap - EXIT

      - name: Verify exact origin binding and separation
        shell: bash
        run: |
          set -euo pipefail
          test -s cohort/features.jsonl
          test -f cohort/outcomes.jsonl
          test -s cohort/manifest.json
          test -s cohort/origin-receipt.json
          test -s cohort/summary.json

          jq -e --arg source "${PONS_S0_SOURCE_COMMIT}" --arg harness "${GITHUB_SHA}" '
            .source.repository == "CipherCuttle/sentry-forensic-gate" and
            .source.repositoryCommit == $source and
            .exportContract.feature == "PONS_S0_FEATURE_PACKET_V1" and
            .exportContract.outcome == "PONS_S0_OUTCOME_PACKET_V1" and
            .exportContract.manifest == "PONS_S0_EXPORT_MANIFEST_V1" and
            .materialization.harnessCommit == $harness and
            .frozenAuthority.targetPerformanceInspectedForSelection == false and
            .materialization.launchDiscovery == "ROBINHOOD_BLOCKSCOUT_PONS_S0_LAUNCH_INDEX_V1" and
            (.materialization.launchIndexSha256 | length) == 64 and
            .frozenAuthority.cohortTargetCount == 96 and
            .frozenAuthority.selectedLaunchCount == .artifacts.featurePacketCount and
            .frozenAuthority.matureUniverseLaunchCount >= .frozenAuthority.selectedLaunchCount and
            (.frozenAuthority.cohortSelection == "COMPLETE_MATURE_FACTORY_UNIVERSE" or
             .frozenAuthority.cohortSelection == "SYSTEMATIC_ORDINAL_SAMPLE_OVER_COMPLETE_MATURE_FACTORY_UNIVERSE_V1") and
            .boundaries.readOnly == true and
            .boundaries.signer == false and
            .boundaries.broadcast == false and
            .boundaries.liveMoneyAuthority == false and
            .boundaries.modelPromotionAuthority == false and
            .boundaries.mergeAuthority == false and
            .boundaries.edge == "UNPROVEN"
          ' cohort/origin-receipt.json >/dev/null

          feature_sha="$(sha256sum cohort/features.jsonl | awk '{print $1}')"
          outcome_sha="$(sha256sum cohort/outcomes.jsonl | awk '{print $1}')"
          manifest_sha="$(sha256sum cohort/manifest.json | awk '{print $1}')"
          test "${feature_sha}" = "$(jq -r '.featureStreamSha256' cohort/manifest.json)"
          test "${outcome_sha}" = "$(jq -r '.outcomeStreamSha256' cohort/manifest.json)"
          test "${feature_sha}" = "$(jq -r '.artifacts.featureStreamSha256' cohort/origin-receipt.json)"
          test "${outcome_sha}" = "$(jq -r '.artifacts.outcomeStreamSha256' cohort/origin-receipt.json)"
          test "${manifest_sha}" = "$(jq -r '.artifacts.manifestFileSha256' cohort/origin-receipt.json)"
          test "$(jq -r '.manifestId' cohort/manifest.json)" = "$(jq -r '.artifacts.manifestId' cohort/origin-receipt.json)"
          test "$(jq -r '.evidenceDigest' cohort/manifest.json)" = "$(jq -r '.artifacts.manifestEvidenceDigest' cohort/origin-receipt.json)"

          jq -e '
            .verdict == "REAL_COHORT_READY_FOR_QNTYLAB" and
            .scientificState == "EDGE_UNPROVEN" and
            .featurePacketCount == .selectedLaunchCount and
            .selectedLaunchCount > 0 and
            .matureUniverseLaunchCount >= .selectedLaunchCount and
            .boundaries.liveMoneyAuthority == false
          ' cohort/summary.json >/dev/null

          sha256sum cohort/features.jsonl cohort/outcomes.jsonl cohort/manifest.json cohort/origin-receipt.json cohort/summary.json > cohort/SHA256SUMS

      - name: Commit immutable cohort evidence to harness branch
        shell: bash
        run: |
          set -euo pipefail
          dest='harness/docs/evidence/pons-s0-real-cohort-v1'
          rm -rf "${dest}"
          mkdir -p "${dest}"
          cp cohort/features.jsonl "${dest}/features.jsonl"
          cp cohort/outcomes.jsonl "${dest}/outcomes.jsonl"
          cp cohort/manifest.json "${dest}/manifest.json"
          cp cohort/origin-receipt.json "${dest}/origin-receipt.json"
          cp cohort/summary.json "${dest}/summary.json"
          cp cohort/SHA256SUMS "${dest}/SHA256SUMS"

          git -C harness config user.name 'github-actions[bot]'
          git -C harness config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C harness add docs/evidence/pons-s0-real-cohort-v1
          if git -C harness diff --cached --quiet; then
            echo 'No evidence diff to commit'
            exit 0
          fi
          git -C harness commit -m 'Materialize origin-bound Pons S0 real cohort [skip ci]'
          git -C harness push origin HEAD:agent/pons-s0-real-cohort-materialization-v1

      - name: Upload cohort evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pons-s0-real-cohort-v1
          path: |
            cohort/
            materialization.log
            pons-s0-rpc-proxy.log
            blockscout-launch-index.json
            blockscout-launch-index-summary.json
          if-no-files-found: warn
          retention-days: 30
