name: PONS E0 wallet dry run

on:
  push:
    branches:
      - ops/pons-e0-wallet-dry-run-20260919

permissions:
  contents: read

jobs:
  dry-run:
    name: single wallet-specific dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Wallet-specific Pons E0 dry run
        env:
          PONS_E0_CANARY_ENABLED: "true"
          PONS_E0_WALLET: "0x9343835Fe138FFfF68293B361b3C69FEbd83C031"
          PONS_E0_RPC_URL: "https://rpc.mainnet.chain.robinhood.com"
          PONS_E0_TOKEN: "0x9edDE11f534Cd56eDAfE46B29fE33319726E9aE5"
        run: pnpm start:pons-e0
