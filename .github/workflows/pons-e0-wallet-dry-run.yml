name: PONS E0 provider-hotfix dry run

on:
  push:
    branches:
      - ops/pons-e0-wallet-dry-run-20260919

permissions:
  contents: read

jobs:
  dry-run:
    name: provider-hotfix wallet dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pons-e0-provider-compat-hotfix-v1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm ponse0check
      - name: Wallet-specific Pons E0 dry run
        env:
          PONS_E0_CANARY_ENABLED: "true"
          PONS_E0_WALLET: "0x9343835Fe138FFfF68293B361b3C69FEbd83C031"
          PONS_E0_RPC_URL: "https://robinhood-mainnet-rpc.blockreq.com/v1/rpc/public"
          PONS_E0_TOKEN: "0x991D1FEd9bd6aA28ce3Fc519ab265Fca68F9875c"
        run: node dist/canary/ponsE0Cli.js
