name: PONS E0 provider-split dry run

on:
  push:
    branches:
      - ops/pons-e0-wallet-dry-run-20260919

permissions:
  contents: read

jobs:
  dry-run:
    name: provider-split wallet dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pons-e0-provider-compat-hotfix-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock=false --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/pons-e0-live-canary-r0-check.mjs
      - name: Wallet-specific Pons E0 dry run
        env:
          PONS_E0_CANARY_ENABLED: "true"
          PONS_E0_WALLET: "0x9343835Fe138FFfF68293B361b3C69FEbd83C031"
          PONS_E0_RPC_URL: "https://rpc.mainnet.chain.robinhood.com"
          PONS_E0_ARCHIVE_RPC_URL: "https://robinhood-mainnet-rpc.blockreq.com/v1/rpc/public"
          PONS_E0_LAUNCH_BLOCK: "67295168"
          PONS_E0_TOKEN: "0x62E7C69057c5b70bc69906e2cabBF8e003c9Fa62"
        run: node dist/canary/ponsE0Cli.js
