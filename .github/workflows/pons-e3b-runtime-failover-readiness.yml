name: pons-e3b-runtime-failover-readiness

concurrency:
  group: pons-e3b-runtime-failover-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/pons-e3b-runtime-failover-wiring-v1
  pull_request:
    paths:
      - 'src/canary/ponsE3BRuntimeFailover.ts'
      - 'src/canary/ponsE3BRuntimeFailoverCli.ts'
      - 'src/canary/ponsE3BRuntimeState.ts'
      - 'scripts/pons-e3b-runtime-failover-check.mjs'
      - '.github/workflows/pons-e3b-runtime-failover-readiness.yml'
      - 'package.json'

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PONS_E0_LIVE: ''
      PONS_E0_PRIVATE_KEY: ''
      PONS_E2_LIVE: ''
      PONS_E2_PRIVATE_KEY: ''
      PONS_E2_BROADCAST_AUTHORITY: ''
      PONS_E3_LIVE: ''
      PONS_E3_PRIVATE_KEY: ''
      PONS_E3_BROADCAST_AUTHORITY: ''
      PONS_E3B_LIVE: ''
      PONS_E3B_PRIVATE_KEY: ''
      PONS_E3B_BROADCAST_AUTHORITY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies without native postinstall
        run: npm install --package-lock=false --include=dev --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify E3B runtime failover offline
        run: npm run ponse3bruntimecheck

      - name: Verify E0-E3 regression chain offline
        run: |
          npm run ponse0check
          npm run ponse1v4recoverycheck
          npm run ponse2v4recoverycheck
          npm run ponse3failovercheck

      - name: Enforce narrow canary signer boundary
        run: node scripts/canary-boundary-check.mjs

      - name: Reconstruct actual E0 BUY handoff fixture
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createPublicClient, decodeEventLog, getAddress, http, parseAbi } from 'viem';

          const rpc = 'https://rpc.mainnet.chain.robinhood.com';
          const buyHash =
            '0x7bbf92280bbb96368c8b67de4d00f6d87e00f718428c9c526a2f46ac1ab02b85';
          const token = getAddress('0x891324B8953B77aC22f764b0e63A336a6C259d62');
          const wallet = getAddress('0x9343835Fe138FFfF68293B361b3C69FEbd83C031');
          const curve = getAddress('0x32c5ad4Ae02b6f16Df43C0b4bE44b69B42ff9D87');
          const abi = parseAbi([
            'event CurveBuy(address indexed buyer, address indexed recipient, uint256 quoteIn, uint256 tokensOut, uint256 fee, uint256 tax)'
          ]);
          const client = createPublicClient({ transport: http(rpc) });
          const receipt = await client.getTransactionReceipt({ hash: buyHash });
          if (receipt.status !== 'success') throw new Error('E3B_E0_BUY_RECEIPT_NOT_SUCCESS');

          const matches = [];
          for (const log of receipt.logs) {
            if (getAddress(log.address) !== curve) continue;
            try {
              const event = decodeEventLog({
                abi,
                eventName: 'CurveBuy',
                data: log.data,
                topics: log.topics
              });
              if (
                getAddress(event.args.buyer) === wallet &&
                getAddress(event.args.recipient) === wallet
              ) {
                matches.push(event.args.tokensOut);
              }
            } catch {}
          }
          if (matches.length !== 1 || matches[0] <= 0n) {
            throw new Error(`E3B_E0_BUY_EVENT_CARDINALITY:${matches.length}`);
          }

          fs.writeFileSync('/tmp/pons-e3b-e0-state.json', JSON.stringify({
            version: 'PONS_E0_LIVE_CANARY_R0',
            status: 'BUY_INCLUDED',
            token,
            curve,
            wallet,
            transactionHash: buyHash,
            buyTransactionHash: buyHash,
            tokensOwned: matches[0].toString()
          }, null, 2));
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `PONS_E3B_OBSERVATION_BLOCK=${receipt.blockNumber.toString()}\n`
          );
          NODE

      - name: Replay actual E0 post-BUY handoff without signer
        env:
          PONS_E3B_ENABLED: 'true'
          PONS_E3B_E0_STATE_PATH: '/tmp/pons-e3b-e0-state.json'
          PONS_E3B_STATE_PATH: '/tmp/pons-e3b-runtime-state.json'
          PONS_E3B_RPC_URL: 'https://rpc.mainnet.chain.robinhood.com'
          PONS_E3B_SLIPPAGE_BPS: '500'
        run: npm run start:pons-e3b-runtime

      - name: Assert E3B has no live authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PONS_E0_LIVE}" || -n "${PONS_E0_PRIVATE_KEY}" || -n "${PONS_E2_LIVE}" || -n "${PONS_E2_PRIVATE_KEY}" || -n "${PONS_E2_BROADCAST_AUTHORITY}" || -n "${PONS_E3_LIVE}" || -n "${PONS_E3_PRIVATE_KEY}" || -n "${PONS_E3_BROADCAST_AUTHORITY}" || -n "${PONS_E3B_LIVE}" || -n "${PONS_E3B_PRIVATE_KEY}" || -n "${PONS_E3B_BROADCAST_AUTHORITY}" ]]; then
            echo "E3B readiness CI must not receive live/signing/broadcast authority"
            exit 1
          fi
          if grep -Eq 'createWalletClient|privateKeyToAccount|sendRawTransaction|signTransaction' src/canary/ponsE3BRuntimeFailover.ts src/canary/ponsE3BRuntimeFailoverCli.ts src/canary/ponsE3BRuntimeState.ts; then
            echo "E3B runtime layer must remain read-only / no signer"
            exit 1
          fi
          grep -q "PONS_E3B_DRY_MODE_LIVE_AUTHORITY_FORBIDDEN" src/canary/ponsE3BRuntimeFailoverCli.ts
          grep -q "PONS_E3B_BROADCAST_AUTHORITY_DISABLED" src/canary/viemPonsE3BCurveCleanupExecutor.ts
          grep -q "REVERIFY_FROM_CHAIN_AFTER_REVOKE" src/canary/ponsE3BRuntimeFailover.ts
          grep -q "PONS_E3B_EXISTING_STATE_REQUIRES_MANUAL_RECONCILIATION" src/canary/ponsE3BRuntimeState.ts
          echo "PONS_E3B_NO_LIVE_AUTHORITY_BOUNDARY_PASS"
